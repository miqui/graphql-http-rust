# Publish to crates.io via Trusted Publishing (OIDC) — no long-lived API token stored.
#
# Trigger: GitHub "Release" is published. The release tag MUST match the
# version in graphql-http/Cargo.toml (e.g. v0.1.0) — the verify step enforces this.
#
# One-time setup (repo Settings → Environments → "crates-io"):
#   - Add environment protection rule: restrict to tag pattern v* (or require approval)
#   - On crates.io: publish graph → Trusted Publishing → add this repo with
#     workflow filename "publish.yml"
#
# Safety: `pull_request`-controlled code never runs here; the publish job builds
# from the protected release ref only, in a GitHub-hosted runner, with the
# short-lived OIDC token scoped by crates.io to this repo + workflow + environment.

name: Publish

'on':
  release:
    types: [published]
  workflow_dispatch: # manual recovery path; same gates apply

permissions:
  contents: read

jobs:
  validate:
    name: validate (release ↔ version)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify tag matches crate version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "graphql-http-rust") | .version')"
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag (v$TAG) does not match graphql-http-rust crate version ($VERSION)"
            exit 1
          fi
      - name: Reject prerelease tags
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            *-*) echo "::error::Prerelease version (${GITHUB_REF_NAME}) is not publishable"; exit 1 ;;
          esac
      - name: Package (full verification build)
        run: cargo package -p graphql-http-rust
      - name: Package listing (log only; no artifact needed)
        run: cargo package -p graphql-http-rust --list

  publish:
    name: publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Exchange OIDC token for crates.io credential
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish -p graphql-http-rust
